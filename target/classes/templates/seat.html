<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选座 - 猫眼电影</title>
    <style>
        /* ==================== 基础重置 ==================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #fff; color: #333; font-size: 14px; }
        a { text-decoration: none; color: inherit; }
        ul, li { list-style: none; }

        /* ==================== 顶部导航栏 ==================== */
        .top-nav { height: 80px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; padding: 0 15%; position: sticky; top: 0; background: #fff; z-index: 100; }
        .logo { display: flex; align-items: center; margin-right: 40px; }
        .logo-icon { width: 40px; height: 40px; background: #ef4238; border-radius: 50%; color: #fff; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; margin-right: 10px; }
        .logo-text { font-size: 20px; font-weight: bold; }
        .main-menu { display: flex; height: 100%; }
        .main-menu li { height: 100%; }
        .main-menu li a { display: flex; align-items: center; height: 100%; padding: 0 20px; font-size: 16px; color: #333; }
        .nav-right { margin-left: auto; display: flex; align-items: center; gap: 20px; }
        .nav-right > div { cursor: pointer; }

        /* ==================== 进度条（还原原版猫眼） ==================== */
        .step-bar { width: 1200px; margin: 30px auto 20px; display: flex; justify-content: center; align-items: center; position: relative; }
        .step { display: flex; align-items: center; flex-direction: column; position: relative; z-index: 2; width: 200px; }
        .step-circle { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 2px solid #f5c6c4; color: #f5c6c4; display: flex; justify-content: center; align-items: center; font-size: 14px; margin-bottom: 10px; font-weight: bold; transition: all 0.3s; }
        .step.active .step-circle { background: #ef4238; border-color: #ef4238; color: #fff; }
        .step-text { font-size: 14px; color: #f5c6c4; transition: all 0.3s; }
        .step.active .step-text { color: #ef4238; font-weight: bold; }
        .step-line { flex: 1; height: 2px; background: #f5c6c4; margin: 0 -100px; margin-top: -18px; position: relative; z-index: 1; }
        .step-line.active { background: #ef4238; }

        /* ==================== 主体布局 ==================== */
        .container { width: 1200px; margin: 0 auto; display: flex; gap: 30px; padding-bottom: 60px; }

        /* ==================== 左侧选座区 ==================== */
        .seat-area { flex: 1; border: 1px solid #e5e5e5; border-radius: 4px; padding: 30px 20px; background: #f8f8f8; display: flex; flex-direction: column; align-items: center; }
        .legend { display: flex; gap: 20px; margin-bottom: 30px; font-size: 14px; color: #666; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-icon { width: 20px; height: 20px; border-radius: 4px 4px 2px 2px; border: 1px solid #ccc; }
        .legend-icon.sold { background: #ef4238; border-color: #ef4238; }
        .legend-icon.selected { background: #67c23a; border-color: #67c23a; }
        .legend-icon.available { background: #fff; }
        .legend-icon.couple { background: #fff; border-style: dashed; }

        /* 银幕 */
        .screen { width: 80%; height: 10px; background: #e5e5e5; border-radius: 50%; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .screen-text { color: #999; font-size: 12px; margin-bottom: 40px; }

        /* 座位图 */
        .seat-map { display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .seat-row { display: flex; gap: 8px; }
        .seat-row-label { width: 20px; text-align: right; margin-right: 10px; color: #999; line-height: 26px; font-size: 14px; }

        /* 座位：带立体感的椅背形状 */
        .seat {
            width: 28px;
            height: 24px;
            border-radius: 6px 6px 2px 2px;
            background: #fff;
            border: 1px solid #ccc;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .seat.available:hover { border-color: #ef4238; transform: scale(1.1); }
        .seat.sold { background: #ef4238; border-color: #ef4238; cursor: not-allowed; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.1); }
        .seat.selected { background: #67c23a; border-color: #67c23a; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.1); }
        /* 情侣座样式（预留，当前未启用） */
        .seat.couple { border-style: dashed; border-color: #ef4238; }

        /* ==================== 右侧信息面板 ==================== */
        .info-area { width: 320px; flex-shrink: 0; border-left: 1px solid #e5e5e5; padding-left: 30px; }
        .movie-info { display: flex; gap: 15px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px dashed #e5e5e5; }
        .movie-poster { width: 80px; height: 110px; border-radius: 4px; background: #1a1a1a; background-size: cover; background-position: center; flex-shrink: 0; }
        .movie-detail { flex: 1; }
        .movie-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .movie-meta { font-size: 12px; color: #999; margin-bottom: 4px; }

        .schedule-info { font-size: 14px; color: #666; line-height: 1.8; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px dashed #e5e5e5; }
        .schedule-info span { color: #333; font-weight: bold; }

        .selected-info { margin-bottom: 20px; }
        .selected-info .label { font-size: 14px; color: #999; margin-bottom: 8px; }
        .selected-seats { display: flex; flex-wrap: wrap; gap: 8px; min-height: 28px; }
        .seat-tag { background: #f0f0f0; padding: 4px 8px; border-radius: 4px; font-size: 12px; color: #333; cursor: pointer; }
        .seat-tag::after { content: '×'; margin-left: 6px; color: #999; }

        .total-price { font-size: 14px; color: #666; margin-bottom: 30px; display: flex; align-items: baseline; }
        .total-price .price { color: #ef4238; font-size: 28px; font-weight: bold; margin-left: 5px; }
        .total-price .price::before { content: '¥'; font-size: 16px; margin-right: 2px; }

        .phone-info { font-size: 14px; color: #999; margin-bottom: 15px; }

        .confirm-btn { width: 100%; height: 44px; border: none; border-radius: 4px; background: #e5e5e5; color: #fff; font-size: 16px; cursor: not-allowed; transition: all 0.3s; }
        .confirm-btn.active { background: #ef4238; cursor: pointer; }
        .confirm-btn.active:hover { background: #d6382f; }

        /* ==================== 页脚 ==================== */
        .footer { background: #262426; color: #999; padding: 40px 0; font-size: 12px; line-height: 2; text-align: center; }

        /* ==================== 浮动广告 ==================== */
        .floating-ad { position: fixed; bottom: 20px; left: 20px; width: 160px; height: 200px; background: #ef4238; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font-size: 12px; z-index: 1000; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .qr-placeholder { width: 100px; height: 100px; background: #fff; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- ==================== 顶部导航 ==================== -->
    <header class="top-nav">
        <div class="logo">
            <div class="logo-icon">猫</div>
            <div class="logo-text">猫眼电影</div>
        </div>
        <ul class="main-menu">
            <li><a th:href="@{/}">首页</a></li>
            <li><a th:href="@{/}">电影</a></li>
            <li><a th:href="@{/}">影院</a></li>
            <li><a href="#">演出</a></li>
        </ul>
        <div class="nav-right">
            <div>📱 APP下载 ▼</div>
            <div>👤 ▼</div>
        </div>
    </header>

    <!-- ==================== 进度条 ==================== -->
    <div class="step-bar">
        <div class="step active">
            <div class="step-circle">1</div>
            <div class="step-text">选择影片场次</div>
        </div>
        <div class="step-line active"></div>
        <div class="step active">
            <div class="step-circle">2</div>
            <div class="step-text">选择座位</div>
        </div>
        <div class="step-line"></div>
        <div class="step">
            <div class="step-circle">3</div>
            <div class="step-text">15分钟内付款</div>
        </div>
        <div class="step-line"></div>
        <div class="step">
            <div class="step-circle">4</div>
            <div class="step-text">影院取票观影</div>
        </div>
    </div>

    <!-- ==================== 主内容区 ==================== -->
    <div class="container">
        <!-- 左侧选座 -->
        <div class="seat-area">
            <div class="legend">
                <div class="legend-item"><div class="legend-icon available"></div>可选座位</div>
                <div class="legend-item"><div class="legend-icon sold"></div>已售座位</div>
                <div class="legend-item"><div class="legend-icon selected"></div>已选座位</div>
                <div class="legend-item"><div class="legend-icon couple"></div>情侣座位</div>
            </div>
            <div class="screen"></div>
            <div class="screen-text">银幕中央</div>
            
            <!-- 座位图容器，JS动态生成。通过 th:attr 将票价传递给 JS -->
            <div class="seat-map" id="seatMap" th:attr="data-price=${schedule != null ? schedule.price : 0}">
                <!-- 座位由 JS 动态渲染 -->
            </div>
        </div>

        <!-- 右侧信息 -->
        <div class="info-area">
            <div class="movie-info">
                <!-- 使用 background-image 支持真实海报 URL -->
                <div class="movie-poster" th:style="'background-image: url(' + ${movie != null ? movie.poster : ''} + '); background-size: cover; background-position: center;'"></div>
                <div class="movie-detail">
                    <div class="movie-title" th:text="${movie != null ? movie.title : '未知电影'}">电影名</div>
                    <div class="movie-meta">类型：剧情</div>
                    <div class="movie-meta">时长：95分钟</div>
                </div>
            </div>
            
            <div class="schedule-info">
                <div>影院：<span th:text="${schedule != null ? schedule.cinemaName : '--'}">影院名</span></div>
                <div>影厅：<span th:text="${schedule != null ? schedule.hallName : '--'}">影厅</span></div>
                <div>版本：<span th:text="${schedule != null ? schedule.language : '--'}">版本</span></div>
                <div>场次：<span th:text="${schedule != null ? schedule.date + ' ' + schedule.startTime : '--'}">时间</span></div>
                <div>票价：<span th:text="${schedule != null ? '¥' + schedule.price : '--'}">价格</span></div>
            </div>

            <div class="selected-info">
                <div class="label">座位：一次最多选6个座位</div>
                <div class="selected-seats" id="selectedSeatsContainer">
                    <!-- 已选座位标签动态生成 -->
                </div>
            </div>

            <div class="total-price">
                总价：<span class="price" id="totalPrice">0</span>
            </div>

            <div class="phone-info">手机号：150****6608</div>
            
            <button class="confirm-btn" id="confirmBtn" disabled>确认选座</button>
        </div>
    </div>

    <!-- ==================== 页脚 ==================== -->
    <footer class="footer">
        <div>关于猫眼：<a href="#" style="color:#ef4238;">关于我们</a> | <a href="#" style="color:#ef4238;">董事会成员</a></div>
        <div>©2026 猫眼电影 www.maoyan.com</div>
    </footer>

    <!-- ==================== 浮动广告 ==================== -->
    <div class="floating-ad">
        <div>丝滑抢票上猫眼</div>
        <div>手机扫码下载猫眼APP</div>
        <div class="qr-placeholder"></div>
    </div>

    <!-- ==================== 选座交互逻辑 ==================== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const seatMap = document.getElementById('seatMap');
            const totalPriceEl = document.getElementById('totalPrice');
            const confirmBtn = document.getElementById('confirmBtn');
            const selectedSeatsContainer = document.getElementById('selectedSeatsContainer');
            
            // 获取当前场次票价
            const price = parseFloat(seatMap.dataset.price) || 0;

            // 座位配置：5排，每排12个座位 (可根据实际需求调整)
            const rows = 5;
            const cols = 12;
            
            // 模拟已售座位 (真实项目中应从后端 API 获取)
            const soldSeats = [
                {row: 1, col: 3}, {row: 1, col: 4},
                {row: 2, col: 5}, {row: 4, col: 1}, 
                {row: 5, col: 12}
            ];

            let selectedSeats = [];

            // 动态生成座位图
            for (let r = 1; r <= rows; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'seat-row';
                
                // 排号标签
                const label = document.createElement('div');
                label.className = 'seat-row-label';
                label.textContent = r;
                rowDiv.appendChild(label);

                // 生成每排座位
                for (let c = 1; c <= cols; c++) {
                    const seat = document.createElement('div');
                    seat.className = 'seat';
                    seat.dataset.row = r;
                    seat.dataset.col = c;

                    // 判断是否已售
                    const isSold = soldSeats.some(s => s.row === r && s.col === c);
                    if (isSold) {
                        seat.classList.add('sold');
                    } else {
                        seat.classList.add('available');
                    }

                    // 绑定点击事件
                    seat.addEventListener('click', function() {
                        if (this.classList.contains('sold')) return;

                        const row = this.dataset.row;
                        const col = this.dataset.col;
                        const seatId = `${row}排${col}座`;

                        if (this.classList.contains('selected')) {
                            // 取消选中
                            this.classList.remove('selected');
                            this.classList.add('available');
                            selectedSeats = selectedSeats.filter(s => s.id !== seatId);
                        } else {
                            // 选中
                            if (selectedSeats.length >= 6) {
                                alert('一次最多选择6个座位！');
                                return;
                            }
                            this.classList.remove('available');
                            this.classList.add('selected');
                            selectedSeats.push({ id: seatId, row: row, col: col });
                        }
                        updateUI();
                    });

                    rowDiv.appendChild(seat);
                }
                seatMap.appendChild(rowDiv);
            }

            // 更新界面UI (总价、已选标签、按钮状态)
            function updateUI() {
                // 更新已选座位标签
                selectedSeatsContainer.innerHTML = '';
                selectedSeats.forEach(s => {
                    const tag = document.createElement('div');
                    tag.className = 'seat-tag';
                    tag.textContent = s.id;
                    // 点击标签可以取消对应座位的选中状态
                    tag.addEventListener('click', () => {
                        const seatEl = document.querySelector(`.seat[data-row="${s.row}"][data-col="${s.col}"]`);
                        if (seatEl) seatEl.click();
                    });
                    selectedSeatsContainer.appendChild(tag);
                });

                // 更新总价
                const total = selectedSeats.length * price;
                totalPriceEl.textContent = total.toFixed(1);

                // 更新确认按钮状态
                if (selectedSeats.length > 0) {
                    confirmBtn.classList.add('active');
                    confirmBtn.disabled = false;
                } else {
                    confirmBtn.classList.remove('active');
                    confirmBtn.disabled = true;
                }
            }

            // 确认选座按钮点击事件
            confirmBtn.addEventListener('click', function() {
                if (selectedSeats.length === 0) return;
                const seatsStr = selectedSeats.map(s => s.id).join(',');
                alert(`选座成功！\n已选座位：${seatsStr}\n总价：¥${(selectedSeats.length * price).toFixed(1)}\n即将跳转支付...`);
                // 实际项目中，这里应该携带 scheduleId 和 seatsStr 提交订单到后端
                // 例如：window.location.href = `/order/confirm?scheduleId=${scheduleId}&seats=${seatsStr}`;
            });
        });
    </script>
</body>
</html>
