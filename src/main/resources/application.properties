# ==================== \u5E94\u7528 ====================
spring.application.name=movie-ticketing
server.port=8080

# ==================== \u6570\u636E\u5E93 ====================
spring.datasource.url=jdbc:mysql://localhost:3306/movie_ticketing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==================== Thymeleaf ====================
# \u5F00\u53D1\u65F6\u5173\u95ED\u7F13\u5B58\uFF0C\u6539 HTML \u540E\u5237\u65B0\u6D4F\u89C8\u5668\u5373\u53EF
spring.thymeleaf.cache=false

# ==================== \u65E5\u5FD7 ====================
# \u5C4F\u853D\u7B2C\u4E09\u65B9\u5E93\u7684 INFO \u65E5\u5FD7
logging.level.root=WARN
# \u53EA\u663E\u793A\u672C\u9879\u76EE\u7684\u65E5\u5FD7
logging.level.com.maoyan=INFO
# SQL \u76F8\u5173\uFF08\u53EA\u5728\u9700\u8981\u6392\u67E5\u65F6\u6253\u5F00\uFF09
