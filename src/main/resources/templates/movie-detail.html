<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>支付 - 猫眼电影</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #fff; color: #333; font-size: 14px; }
        a { text-decoration: none; color: inherit; }
        ul, li { list-style: none; }

        .top-nav { height: 80px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; padding: 0 15%; }
        .logo { display: flex; align-items: center; margin-right: 40px; }
        .logo-icon { width: 40px; height: 40px; background: #ef4238; border-radius: 50%; color: #fff; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; margin-right: 10px; }
        .logo-text { font-size: 20px; font-weight: bold; }
        .main-menu { display: flex; height: 100%; }
        .main-menu li a { display: flex; align-items: center; height: 100%; padding: 0 20px; font-size: 16px; color: #333; }

        .step-bar { width: 1200px; margin: 30px auto 20px; display: flex; justify-content: center; align-items: center; }
        .step { display: flex; align-items: center; flex-direction: column; width: 200px; }
        .step-circle { width: 28px; height: 28px; border-radius: 50%; background: #ef4238; border: 2px solid #ef4238; color: #fff; display: flex; justify-content: center; align-items: center; font-size: 14px; margin-bottom: 10px; font-weight: bold; }
        .step-circle.gray { background: #fff; border-color: #f5c6c4; color: #f5c6c4; }
        .step-text { font-size: 14px; color: #ef4238; font-weight: bold; }
        .step-text.gray { color: #f5c6c4; font-weight: normal; }
        .step-line { flex: 1; height: 2px; background: #ef4238; margin: 0 -100px; margin-top: -18px; }
        .step-line.gray { background: #f5c6c4; }

        .container { width: 900px; margin: 0 auto 60px; }
        .tip-box { background: #fef0f0; padding: 20px 30px; border-radius: 4px; display: flex; align-items: center; margin-bottom: 30px; }
        .tip-icon { font-size: 32px; margin-right: 20px; color: #ef4238; }
        .tip-title { font-size: 18px; color: #ef4238; font-weight: bold; margin-bottom: 5px; }
        .tip-sub { font-size: 13px; color: #999; }

        .warning { color: #ff9800; font-size: 13px; margin-bottom: 15px; }

        .info-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        .info-table th { background: #fafafa; padding: 12px; font-weight: normal; color: #999; font-size: 14px; text-align: center; border-bottom: 1px solid #e5e5e5; }
        .info-table td { padding: 20px 12px; text-align: center; font-size: 14px; }

        .total-row { text-align: right; font-size: 16px; margin-bottom: 30px; }
        .total-row .num { color: #ef4238; font-size: 30px; font-weight: bold; }
        .total-row .num::before { content: '¥'; font-size: 18px; }

        .pay-btn { display: block; margin: 0 auto; background: #ef4238; color: #fff; padding: 14px 80px; border: none; border-radius: 4px; font-size: 18px; cursor: pointer; }
        .pay-btn:hover { background: #d6382f; }
        .pay-btn:disabled { background: #ccc; cursor: not-allowed; }

        .paid-card { border: 2px dashed #43a047; background: #f0fff4; border-radius: 8px; padding: 40px; text-align: center; margin-bottom: 30px; }
        .paid-card .check-icon { font-size: 48px; color: #43a047; margin-bottom: 15px; }
        .paid-card .paid-title { font-size: 20px; color: #2e7d32; font-weight: bold; margin-bottom: 10px; }
        .paid-card .ticket-label { font-size: 14px; color: #43a047; margin-bottom: 10px; }
        .paid-card .ticket-code { font-size: 40px; letter-spacing: 6px; font-weight: bold; color: #2e7d32; margin-bottom: 15px; }
        .paid-card .paid-sub { font-size: 13px; color: #888; }

        .footer { background: #262426; color: #999; padding: 40px 0; font-size: 12px; line-height: 2; text-align: center; }
        .footer a { color: #ef4238; }
    </style>
</head>
<body>

<header class="top-nav">
    <div class="logo">
        <div class="logo-icon">猫</div>
        <div class="logo-text">猫眼电影</div>
    </div>
    <ul class="main-menu">
        <li><a th:href="@{/}">首页</a></li>
        <li><a th:href="@{/}">电影</a></li>
        <li><a th:href="@{/}">影院</a></li>
        <li><a href="#">演出</a></li>
    </ul>
</header>

<!-- 进度条：全部静态，不做动态类名，避免 Thymeleaf 表达式出错 -->
<div class="step-bar">
    <div class="step">
        <div class="step-circle">1</div>
        <div class="step-text">选择影片场次</div>
    </div>
    <div class="step-line"></div>
    <div class="step">
        <div class="step-circle">2</div>
        <div class="step-text">选择座位</div>
    </div>
    <div class="step-line" th:classappend="${order != null and order.status == 'paid'} ? 'gray' : ''"></div>
    <div class="step">
        <div class="step-circle" th:classappend="${order != null and order.status == 'paid'} ? '' : 'gray'">3</div>
        <div class="step-text" th:classappend="${order != null and order.status == 'paid'} ? '' : 'gray'">15分钟内付款</div>
    </div>
    <div class="step-line" th:classappend="${order != null and order.status == 'paid'} ? '' : 'gray'"></div>
    <div class="step">
        <div class="step-circle" th:classappend="${order != null and order.status == 'paid'} ? '' : 'gray'">4</div>
        <div class="step-text" th:classappend="${order != null and order.status == 'paid'} ? '' : 'gray'">影院取票观影</div>
    </div>
</div>

<div class="container" th:if="${order != null}"
     th:attr="data-order-id=${order.id}" id="orderWrap">

    <!-- 待支付 -->
    <div th:if="${order.status == 'pending'}">
        <div class="tip-box">
            <div class="tip-icon">⏳</div>
            <div>
                <div class="tip-title">请在 15 分钟内完成支付</div>
                <div class="tip-sub">超时订单会自动取消，如遇支付问题，请致电猫眼客服：1010-5335</div>
            </div>
        </div>

        <div class="warning">⚠️ 请仔细核对场次信息，出票后将无法退票和改签</div>

        <table class="info-table">
            <thead>
            <tr><th>影片</th><th>时间</th><th>影院</th><th>座位</th></tr>
            </thead>
            <tbody>
            <tr>
                <td>《<span th:text="${order.movieTitle}">-</span>》</td>
                <td th:text="${order.showTime}">-</td>
                <td th:text="${order.cinemaName}">-</td>
                <td th:text="${order.seats}">-</td>
            </tr>
            </tbody>
        </table>

        <div class="total-row">实际支付：<span class="num" th:text="${order.totalPrice}">0</span></div>

        <button class="pay-btn" id="payBtn">确认支付</button>
    </div>

    <!-- 已支付 -->
    <div th:if="${order.status == 'paid'}">
        <div class="paid-card">
            <div class="check-icon">✓</div>
            <div class="paid-title">支付成功</div>
            <div class="ticket-label">取 票 码</div>
            <div class="ticket-code" th:text="${order.ticketCode}">ABCD-1234</div>
            <div class="paid-sub">请凭取票码到影院自助取票机取票</div>
        </div>

        <table class="info-table">
            <thead>
            <tr><th>影片</th><th>时间</th><th>影院</th><th>座位</th></tr>
            </thead>
            <tbody>
            <tr>
                <td>《<span th:text="${order.movieTitle}">-</span>》</td>
                <td th:text="${order.showTime}">-</td>
                <td th:text="${order.cinemaName}">-</td>
                <td th:text="${order.seats}">-</td>
            </tr>
            </tbody>
        </table>

        <div class="total-row">已支付：<span class="num" th:text="${order.totalPrice}">0</span></div>
    </div>

    <!-- 已取消 -->
    <div th:if="${order.status == 'cancelled'}" style="text-align:center;padding:60px 0;color:#999;">
        <div style="font-size:48px;margin-bottom:20px;">✕</div>
        <div style="font-size:20px;">订单已取消</div>
    </div>
</div>

<div class="container" th:if="${order == null}" style="text-align:center;padding:80px 0;color:#999;">
    订单不存在，<a th:href="@{/}" style="color:#ef4238;">返回首页</a>
</div>

<footer class="footer">
    <div>关于猫眼：<a href="#">关于我们</a> | <a href="#">董事会成员</a></div>
    <div>©2026 猫眼电影 www.maoyan.com</div>
</footer>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const wrap = document.getElementById('orderWrap');
    if (!wrap) return;

    const orderId = wrap.dataset.orderId;
    const payBtn = document.getElementById('payBtn');
    if (!payBtn) return;

    payBtn.addEventListener('click', function () {
        if (!confirm('确认支付该订单？')) return;

        payBtn.disabled = true;
        payBtn.textContent = '支付中...';

        fetch('/api/orders/' + orderId + '/pay', { method: 'POST' })
            .then(res => res.json().then(data => {
                if (!res.ok) throw new Error(data.message || '支付失败');
                return data;
            }))
            .then(order => {
                alert('支付成功！\n取票码：' + order.ticketCode);
                window.location.reload();
            })
            .catch(err => {
                alert(err.message);
                payBtn.disabled = false;
                payBtn.textContent = '确认支付';
            });
    });
});
</script>

</body>
</html>
